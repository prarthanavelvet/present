<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5645c0;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        .switch a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .switch a:hover {
            text-decoration: underline;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .hidden {
            display: none;
        }

        .show-password {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 8px;
            font-size: 13px;
        }

        .show-password input {
            width: auto;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOGIN FORM -->
    <div id="loginForm">
        <h2>Welcome Back!</h2>

        <form id="login">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword"
                       placeholder="Enter your password" required>

                <div class="show-password">
                    <input type="checkbox"
                           onchange="togglePassword('loginPassword', this)">
                    <label>Show password</label>
                </div>
            </div>

            <button type="submit">Login</button>

            <p id="loginMessage" class="message"></p>
        </form>

        <p class="switch">
            Don't have an account?
            <a onclick="showRegister()">Register</a>
        </p>
    </div>


    <!-- REGISTRATION FORM -->
    <div id="registerForm" class="hidden">
        <h2>Create Account</h2>

        <form id="register">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name"
                       placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="registerEmail">Email Address</label>
                <input type="email" id="registerEmail"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword"
                       placeholder="Create a password"
                       minlength="6" required>

                <div class="show-password">
                    <input type="checkbox"
                           onchange="togglePassword('registerPassword', this)">
                    <label>Show password</label>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword"
                       placeholder="Confirm your password" required>
            </div>

            <button type="submit">Register</button>

            <p id="registerMessage" class="message"></p>
        </form>

        <p class="switch">
            Already have an account?
            <a onclick="showLogin()">Login</a>
        </p>
    </div>


    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">
        <h2>Login Successful!</h2>
        <p id="welcomeMessage"
           style="text-align:center; margin-bottom:20px;">
        </p>
        <button onclick="logout()">Logout</button>
    </div>

</div>


<script>
    // Switch to registration form
    function showRegister() {
        document.getElementById("loginForm").classList.add("hidden");
        document.getElementById("registerForm").classList.remove("hidden");
        clearMessages();
    }

    // Switch to login form
    function showLogin() {
        document.getElementById("registerForm").classList.add("hidden");
        document.getElementById("loginForm").classList.remove("hidden");
        clearMessages();
    }

    // Show or hide password
    function togglePassword(id, checkbox) {
        const password = document.getElementById(id);
        password.type = checkbox.checked ? "text" : "password";
    }

    // Display a message
    function displayMessage(id, message, type) {
        const element = document.getElementById(id);
        element.textContent = message;
        element.className = "message " + type;
    }

    function clearMessages() {
        document.getElementById("loginMessage").textContent = "";
        document.getElementById("registerMessage").textContent = "";
    }

    // Get registered users from localStorage
    function getUsers() {
        return JSON.parse(localStorage.getItem("users") || "[]");
    }

    // REGISTER
    document.getElementById("register").addEventListener("submit", function(e) {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("registerEmail").value.trim().toLowerCase();
        const password = document.getElementById("registerPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password.length < 6) {
            displayMessage("registerMessage",
                "Password must be at least 6 characters.", "error");
            return;
        }

        if (password !== confirmPassword) {
            displayMessage("registerMessage",
                "Passwords do not match!", "error");
            return;
        }

        const users = getUsers();

        const existingUser = users.find(user => user.email === email);

        if (existingUser) {
            displayMessage("registerMessage",
                "This email is already registered!", "error");
            return;
        }

        users.push({
            name: name,
            email: email,
            password: password
        });

        localStorage.setItem("users", JSON.stringify(users));

        displayMessage("registerMessage",
            "Registration successful! Please login.", "success");

        document.getElementById("register").reset();

        setTimeout(showLogin, 1200);
    });

    // LOGIN
    document.getElementById("login").addEventListener("submit", function(e) {
        e.preventDefault();

        const email = document.getElementById("loginEmail").value.trim().toLowerCase();
        const password = document.getElementById("loginPassword").value;

        const users = getUsers();

        const user = users.find(user =>
            user.email === email && user.password === password
        );

        if (user) {
            document.getElementById("loginForm").classList.add("hidden");
            document.getElementById("registerForm").classList.add("hidden");
            document.getElementById("dashboard").classList.remove("hidden");

            document.getElementById("welcomeMessage").textContent =
                "Welcome, " + user.name + "! You are logged in.";
        } else {
            displayMessage("loginMessage",
                "Invalid email or password!", "error");
        }
    });

    // LOGOUT
    function logout() {
        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("loginForm").classList.remove("hidden");
        document.getElementById("login").reset();
        clearMessages();
    }
</script>

</body>
</html>
